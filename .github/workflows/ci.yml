name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 目标机为 Python 3.13，CI 同时验证 3.12/3.13（T-25）
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 按锁文件装（R3-9）：生产 setup.sh 装的是 requirements.lock.txt，
      # CI 用松版本范围会测到与部署不同的依赖组合
      - name: Install dependencies (locked)
        run: python -m pip install -r requirements-dev.lock.txt
      - name: Compile check (CONTRIBUTING §8)
        run: python -m compileall app -q
      - name: Test
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build (assert dist/index.html)
        run: |
          npm run build
          test -f dist/index.html

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json
      - name: Install backend (locked)
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install e2e
        working-directory: tests/e2e
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: tests/e2e
        env:
          CI: true
          EC_E2E_PYTHON: python
        run: npx playwright test
